name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: backend-library
  DOTNET_VERSION: "7.0.x"
  BACKEND_PROJECT: backend/backend.csproj
  PUBLISH_DIR: ./publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.BACKEND_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.BACKEND_PROJECT }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.BACKEND_PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
